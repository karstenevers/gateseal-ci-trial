# Throwaway timing trial: the gate job of gateseal 0.2.0 with its home in the
# job's temporary folder, cold or with that home restored by actions/cache.
name: trial
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  GATESEAL_UV_URL: "https://github.com/astral-sh/uv/releases/download/0.13.6/uv-x86_64-unknown-linux-gnu.tar.gz"
  GATESEAL_UV_SHA256: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
  GATESEAL_MISE_URL: "https://github.com/jdx/mise/releases/download/v2026.10.19/mise-v2026.10.19-linux-x64"
  GATESEAL_MISE_SHA256: "3162760f40b6b5f706c60641e4ef5ee7322bc6c54f72fc26a7111b337aa18d9d"
  GATESEAL_PYTHON: "3.14"
  GATESEAL_REPOSITORY: "https://github.com/karstenevers/gateseal"
  GATESEAL_COMMIT: "1e17fca34571e8e1c8e7e287a4053a45f1ca2e4b"
jobs:
  gateseal:
    strategy:
      matrix:
        mode: [cold, store]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the gateseal cache
        if: matrix.mode == 'store'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: gateseal-store-v1-${{ runner.os }}-${{ hashFiles('gateseal.lock') }}
          path: ${{ runner.temp }}/gateseal/home/.cache/pre-commit
      - name: Set up the locked gateseal, pre-commit and the policy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          start=$(date +%s.%N)
          job="$RUNNER_TEMP/gateseal"
          agent_home=$HOME
          export HOME="$job/home" XDG_CONFIG_HOME="$job/home/.config" XDG_CACHE_HOME="$job/home/.cache"
          export XDG_DATA_HOME="$job/home/.local/share" XDG_STATE_HOME="$job/home/.local/state"
          mkdir -p "$HOME"
          printf '[include]\n\tpath = %s\n' "$agent_home/.gitconfig" > "$HOME/.gitconfig"
          tools="$job/tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error "$GATESEAL_UV_URL" --output "$tools/uv.tar.gz"
          echo "$GATESEAL_UV_SHA256  $tools/uv.tar.gz" | sha256sum --check -
          tar -xzf "$tools/uv.tar.gz" -C "$tools" --strip-components=1
          curl --fail --location --silent --show-error "$GATESEAL_MISE_URL" --output "$tools/mise"
          echo "$GATESEAL_MISE_SHA256  $tools/mise" | sha256sum --check -
          chmod 0755 "$tools/uv" "$tools/mise"
          export PATH="$tools:$PATH"
          echo "$tools" >> "$GITHUB_PATH"
          command="$HOME/command"
          if [ ! -x "$command/bin/gateseal" ]; then
            uv venv --no-config --managed-python --python "$GATESEAL_PYTHON" "$command"
            uv pip install --no-config --python "$command/bin/python" "gateseal @ git+$GATESEAL_REPOSITORY@$GATESEAL_COMMIT"
          fi
          "$command/bin/gateseal" setup
          "$command/bin/gateseal" check
          echo "TRIAL setup_seconds=$(echo "$(date +%s.%N) - $start" | bc)"
      - name: Run the gateseal gate
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s.%N)
          job="$RUNNER_TEMP/gateseal"
          export HOME="$job/home" XDG_CONFIG_HOME="$job/home/.config" XDG_CACHE_HOME="$job/home/.cache"
          export XDG_DATA_HOME="$job/home/.local/share" XDG_STATE_HOME="$job/home/.local/state"
          "$HOME/command/bin/gateseal" gate --json > "$job/gate.json" || { cat "$job/gate.json"; exit 1; }
          grep -o 'The gate took [0-9.]* seconds' "$job/gate.json" | sed 's/^/TRIAL /' || true
          echo "TRIAL gate_seconds=$(echo "$(date +%s.%N) - $start" | bc)"
          rm -rf "$HOME/.cache/uv" "$HOME/.cache/pip" "$HOME/.cache/virtualenv" "$job/gate.json"
          du -sh "$HOME" | sed 's/^/TRIAL du /'
